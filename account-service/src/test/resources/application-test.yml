spring:
  datasource:
    url: jdbc:h2:mem:account_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

security:
  jwt:
    secret: test-jwt-secret-that-is-longer-than-thirty-two-characters
    issuer: ridelink-account-service
    expiry-seconds: 3600
  internal:
    service-token: test-service-token-that-is-longer-than-thirty-two-characters
