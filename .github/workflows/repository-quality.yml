name: Repository quality

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  repository-quality:
    name: Repository quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run repository checks
        shell: pwsh
        run: ./scripts/pre-pr-check.ps1 -Ci -SkipTests -BaseRef "origin/${{ github.base_ref }}"
