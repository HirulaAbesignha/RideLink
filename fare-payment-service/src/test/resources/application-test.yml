spring:
  datasource:
    url: jdbc:h2:mem:payment_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

security:
  jwt:
    secret: test-only-jwt-signing-secret-for-local-tests-123456
    issuer: ridelink-account-service
  internal:
    service-token: test-only-service-token-placeholder-with-32-characters

services:
  ride:
    base-url: http://localhost:8083
