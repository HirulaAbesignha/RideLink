spring:
  application:
    name: fare-payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${PAYMENT_DB_USERNAME:postgres}
    password: ${PAYMENT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PAYMENT_PORT:8084}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ridelink-account-service
  internal:
    service-token: ${SERVICE_TOKEN}

services:
  ride:
    base-url: ${RIDE_SERVICE_URL:http://localhost:8083}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
