services:
  payment-db:
    image: postgres:17-alpine
    container_name: ridelink-payment-db
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-ridelink-local-only}
    ports: ["55434:5432"]
    volumes: [payment-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_db"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  payment-db-data:
