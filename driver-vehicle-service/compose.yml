services:
  driver-db:
    image: postgres:17-alpine
    container_name: ridelink-driver-db
    environment:
      POSTGRES_DB: driver_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DRIVER_DB_PASSWORD:-ridelink-local-only}
    ports:
      - "55432:5432"
    volumes:
      - driver-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d driver_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  driver-db-data:
