spring:
  application:
    name: driver-vehicle-service
  datasource:
    url: ${DRIVER_DB_URL:jdbc:postgresql://localhost:5432/driver_db}
    username: ${DRIVER_DB_USERNAME:postgres}
    password: ${DRIVER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${DRIVER_PORT:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

services:
  account:
    base-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ridelink-account-service
  internal:
    service-token: ${SERVICE_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
