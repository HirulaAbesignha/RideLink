spring:
  datasource:
    url: jdbc:h2:mem:driver_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

services:
  account:
    base-url: http://localhost:18081

security:
  jwt:
    secret: test-jwt-secret-with-at-least-32-characters
    issuer: ridelink-account-service
  internal:
    service-token: test-service-token-with-at-least-32-characters
